name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "Starting deployment..."

            cd /home/ubuntu

            if [ ! -d "aiops-config" ]; then
              echo "Repository not found. Cloning..."
              git clone https://github.com/RajatInDevOps/aiops-config.git
            fi

            cd aiops-config

            echo "Cleaning workspace..."
            rm -f app.log
            git clean -fd

            echo "Syncing latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Current commit:"
            git log -1 --oneline

            echo "Installing dependencies..."
            npm install

            echo "Stopping existing application..."
            sudo pkill node || true

            echo "Starting application..."
            nohup node app.js > app.log 2>&1 &

            echo "Performing health check..."
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)

            echo "HTTP status: $STATUS"

            if [ "$STATUS" != "200" ]; then
              echo "Application is not healthy after deployment"
              exit 1
            else
              echo "Application is running successfully"
            fi

            echo "Deployment completed successfully"
